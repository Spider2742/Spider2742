name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  # also run when this workflow itself changes, so edits take effect straight away
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github&color_snake=#58a6ff
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#58a6ff
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      # Daily counts for the activity graph on spidey.in (dates and counts only)
      - name: Export contribution calendar
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api graphql -f login="${{ github.repository_owner }}" -f query='
            query($login: String!) {
              user(login: $login) { contributionsCollection { contributionCalendar {
                weeks { contributionDays { date contributionCount contributionLevel } }
              } } }
            }' --jq '[.data.user.contributionsCollection.contributionCalendar.weeks[].contributionDays[]
              | { date, count: .contributionCount,
                  level: ({ NONE: 0, FIRST_QUARTILE: 1, SECOND_QUARTILE: 2, THIRD_QUARTILE: 3, FOURTH_QUARTILE: 4 }[.contributionLevel]) }]' \
            > contributions.json
          test "$(jq length contributions.json)" -gt 300 && mv contributions.json dist/

      - name: Push to output branch
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "update snake SVGs"
          git push --force https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:output
